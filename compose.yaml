services:
  web:
    build: .
    image: ${DIRECTORY_IMAGE:-next-directory-starter:local}
    init: true
    env_file:
      - ${DIRECTORY_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      DIRECTORY_EXPLICIT_MIGRATIONS: "1"
      DATABASE_URL: file:/app/data/directory.db
      MEDIA_DIR: /app/data/media
      SITE_URL: ${SITE_URL:?Set SITE_URL in the Compose environment file}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in the Compose environment file}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the Compose environment file}
    ports:
      - 127.0.0.1:${DIRECTORY_PORT:-3000}:3000
    volumes:
      - directory-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  directory-data:
